<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Not Found — TechFix Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{ color-scheme: light; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    background:#f6f8fb;color:#1c2733;margin:0;
  }
  .box{max-width:420px;padding:24px;}
  .code{font-size:64px;font-weight:800;color:#0f2540;margin-bottom:8px;}
  h1{font-size:20px;color:#0f2540;margin-bottom:10px;}
  p{color:#5b6b7c;font-size:15px;margin-bottom:24px;}
  a.btn{background:#1d6fe0;color:#fff;padding:12px 22px;border-radius:9px;text-decoration:none;font-weight:700;font-size:14.5px;}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved.</p>
    <a class="btn" href="index.html">Back to Home</a>
  </div>
</body>
</html>
